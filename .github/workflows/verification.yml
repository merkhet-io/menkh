name: Verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry-and-zig:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: formal
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Install pinned Zig locally and select the runner SDK
        run: |
          ./scripts/bootstrap-zig.sh
          echo "MENKH_SDK=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Existing simulator tests
        run: |
          ./zig build -Doptimize=ReleaseFast
          ./zig build test --summary all
          ./zig build test -Doptimize=ReleaseFast --summary all
      - name: Grinding-wheel jobs and portable provenance reader
        run: |
          python3 scripts/test-grinding.py
          xcrun clang++ -std=c++17 -O2 viewer/windows/history-test.cpp -o out/history-test
          python3 scripts/test-scene.py --reader out/history-test
          python3 scripts/test-provenance.py
          python3 scripts/test-viewer-provenance.py --exe out/history-test
          python3 scripts/test-playback-provenance.py
          out/history-test out/playback-provenance/all_frames/voxel-animation.json out/playback-provenance/all_frames/oracle.json
          python3 scripts/test-viewer-provenance.py --exe out/history-test --history out/playback-provenance/all_frames/voxel-animation.json
          python3 scripts/test-live-overlays.py --reader out/history-test
      - name: C embedding boundary and independent host
        run: |
          ./zig build sdk -Doptimize=ReleaseFast
          ./zig build sdk-static -Doptimize=ReleaseFast
          ./zig build sdk-test --summary all
          ./zig build sdk-test -Doptimize=ReleaseFast --summary all
          python3 scripts/test-sdk.py
      - name: Consistent live publication, leases and cancellation
        run: python3 scripts/test-live-inspection.py
      - name: Job CLI overrides
        run: |
          python3 scripts/test-job-options.py
          python3 scripts/test-provenance-options.py
      - name: Independent final-surface provenance oracle
        run: |
          python3 scripts/test-provenance.py
          ./scripts/build-viewer.sh
      - name: Viewer-owned calculation lifecycle (no GPU required)
        run: |
          ./scripts/build-viewer.sh
          python3 scripts/test-viewer-jobs.py --viewer zig-out/bin/menkh-viewer --engine zig-out/bin/menkh --out out/macos-job-runner
      - name: Geometry proofs, axiom audit, and Zig differential tests
        run: ./scripts/verify-formal.sh
      - name: Imported finishing mesh oracles
        run: |
          python3 scripts/test-finishing-import.py
          python3 scripts/test-scanline-import.py
      - name: Continuous ball and fixture-clearance oracles
        run: |
          python3 scripts/validate-ball-sweep.py --smoke
          python3 scripts/clamped-finishing.py --voxel 0.25 --skip-build --out out/clamped-ci
      - name: Defect regions, saved-state inspection and viewer build
        run: |
          python3 scripts/test-defect-inspector.py --result out/clamped-ci/unsafe
          ./scripts/build-viewer.sh
          xcrun swiftc viewer/Presentation.swift tests/viewer/PresentationTest.swift -o out/presentation-test
          out/presentation-test
  windows-cli:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned repository-local Zig
        shell: pwsh
        run: ./scripts/bootstrap-zig.ps1
      - name: Build CLI and predicate benchmark
        shell: pwsh
        run: ./zig.ps1 build -Doptimize=ReleaseFast
      - name: Debug tests
        shell: pwsh
        run: ./zig.ps1 build test --summary all
      - name: ReleaseFast tests
        shell: pwsh
        run: ./zig.ps1 build test -Doptimize=ReleaseFast --summary all
      - name: Provenance CLI defaults and overrides
        shell: pwsh
        run: python scripts/test-provenance-options.py
      - name: Live publication and reader leases
        shell: pwsh
        run: |
          python scripts/test-live-inspection.py
          if ($LASTEXITCODE -ne 0) { throw 'Live publication tests failed' }
      - name: C embedding DLL and independent host
        shell: pwsh
        run: |
          ./zig.ps1 build sdk -Doptimize=ReleaseFast
          if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
          ./zig.ps1 build sdk-static -Doptimize=ReleaseFast
          if ($LASTEXITCODE -ne 0) { throw 'Static SDK build failed' }
          ./zig.ps1 build sdk-test --summary all
          if ($LASTEXITCODE -ne 0) { throw 'SDK tests failed' }
          python scripts/test-sdk.py
          if ($LASTEXITCODE -ne 0) { throw 'C host failed' }
      - name: Execute pocket demo and inspect its surface
        shell: pwsh
        run: |
          python -c "import json,pathlib; j=json.loads(pathlib.Path('examples/pocket-25um.json').read_text()); j.update(export_provenance=True,provenance_scope='all_frames'); pathlib.Path('out/windows-pocket-job.json').write_text(json.dumps(j))"
          if ($LASTEXITCODE -ne 0) { throw 'Color demo job generation failed' }
          ./zig-out/bin/menkh.exe job out/windows-pocket-job.json --out out/windows-pocket
          if ($LASTEXITCODE -ne 0) { throw 'Simulation failed' }
          ./zig-out/bin/menkh.exe inspect-state out/windows-pocket/final.menkh | Out-File -Encoding utf8 out/windows-surface.json
          if ($LASTEXITCODE -ne 0) { throw 'Inspection failed' }
          $result = Get-Content out/windows-surface.json -Raw | ConvertFrom-Json
          if ($result.occupied_voxels -ne 170711351) { throw 'Unexpected final material count' }
          if ($result.boundary.surface_voxels -ne 2819284) { throw 'Unexpected surface count' }

      - name: Build native D3D12 viewer with MSVC
        shell: pwsh
        run: |
          cmd /c viewer\windows\build.bat 2>&1 | Tee-Object out/windows-viewer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Viewer batch build failed' }
          cmd /c "viewer\windows\build.bat --project" 2>&1 | Tee-Object out/windows-viewer-project.log
          if ($LASTEXITCODE -ne 0) { throw 'Viewer project build failed' }
      - name: Scene workpieces and native D3D12 selection
        shell: pwsh
        run: python scripts/test-scene.py --reader out/windows-viewer/menkh-viewer.exe --viewer
      - name: Live D3D12 inspection, controls and failure recovery
        shell: pwsh
        run: |
          python scripts/test-windows-live.py --viewer out/windows-viewer/menkh-viewer.exe --engine zig-out/bin/menkh.exe --library zig-out/bin/menkh.dll
          if ($LASTEXITCODE -ne 0) { throw 'Windows live inspection failed' }
      - name: Live exposure and target comparison oracles and rendered sections
        shell: pwsh
        run: |
          python scripts/test-live-overlays.py --reader out/windows-viewer/menkh-viewer.exe --viewer --render
          if ($LASTEXITCODE -ne 0) { throw 'Live inspection overlays failed' }
      - name: Default drill animation opens in Windows viewer
        shell: pwsh
        run: |
          ./zig-out/bin/menkh.exe drill --out out/windows-drill
          if ($LASTEXITCODE -ne 0) { throw 'Drill generation failed' }
          python scripts/test-drill-viewer.py --exe out/windows-viewer/menkh-viewer.exe --history out/windows-drill/animation.json --viewer
          if ($LASTEXITCODE -ne 0) { throw 'Drill compatibility failed' }
          ./out/windows-viewer/menkh-viewer.exe out/windows-drill/animation.json --warp --debug --smoke out/windows-drill-render
          if ($LASTEXITCODE -ne 0) { throw 'Drill rendering failed' }
      - name: Viewer-owned calculation, cancellation and automatic D3D12 result load
        shell: pwsh
        run: |
          python scripts/test-viewer-jobs.py --viewer out/windows-viewer/menkh-viewer.exe --engine zig-out/bin/menkh.exe --out out/windows-job-runner
          if ($LASTEXITCODE -ne 0) { throw 'Viewer job lifecycle failed' }
          python scripts/test-viewer-jobs.py --viewer out/windows-viewer/menkh-viewer.exe --engine zig-out/bin/menkh.exe --library zig-out/bin/menkh.dll --out out/windows-library-runner
          if ($LASTEXITCODE -ne 0) { throw 'Viewer DLL lifecycle failed' }
          ./out/windows-viewer/menkh-viewer.exe examples/general.json --library zig-out/bin/menkh.dll --job-output out/windows-dll-render --warp --debug --smoke out/windows-dll-render-images
          if ($LASTEXITCODE -ne 0) { throw 'Viewer DLL rendering failed' }
          ./out/windows-viewer/menkh-viewer.exe examples/general.json --engine zig-out/bin/menkh.exe --job-output out/windows-job-render --warp --debug --smoke out/windows-job-render-images
          if ($LASTEXITCODE -ne 0) { throw 'Automatic job/result render failed' }
      - name: Grinding-wheel jobs and Windows provenance rendering
        shell: pwsh
        run: |
          python scripts/test-grinding.py
          if ($LASTEXITCODE -ne 0) { throw 'Rotary jobs failed' }
          ./out/windows-viewer/menkh-viewer.exe out/grinding-test/profile-visible/voxel-animation.json --verify-history --warp --debug --frame 4 --snapshot out/windows-profile.ppm
          if ($LASTEXITCODE -ne 0) { throw 'Profile history/render failed' }
          python scripts/test-provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Provenance oracle failed' }
          python scripts/test-viewer-provenance.py --exe out/windows-viewer/menkh-viewer.exe --viewer
          if ($LASTEXITCODE -ne 0) { throw 'Provenance reader failed' }
          ./out/windows-viewer/menkh-viewer.exe out/provenance-test/voxel-animation.json --color-operation --warp --debug --snapshot out/windows-provenance.ppm
          if ($LASTEXITCODE -ne 0) { throw 'Provenance render failed' }
      - name: Playback exposure oracle and D3D12 rewind
        shell: pwsh
        run: |
          python scripts/test-playback-provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Playback extraction oracle failed' }
          python scripts/test-viewer-provenance.py --exe out/windows-viewer/menkh-viewer.exe --viewer --history out/playback-provenance/all_frames/voxel-animation.json
          if ($LASTEXITCODE -ne 0) { throw 'Playback metadata validation failed' }
          ./out/windows-viewer/menkh-viewer.exe out/playback-provenance/all_frames/voxel-animation.json --verify-provenance-oracle out/playback-provenance/all_frames/oracle.json
          if ($LASTEXITCODE -ne 0) { throw 'Playback query oracle failed' }
          ./out/windows-viewer/menkh-viewer.exe out/playback-provenance/all_frames/voxel-animation.json --color-operation --warp --debug --smoke out/windows-playback-provenance
          if ($LASTEXITCODE -ne 0) { throw 'Playback rendering failed' }
      - name: Reject malformed viewer histories
        shell: pwsh
        run: python scripts/test-viewer-history.py --exe out/windows-viewer/menkh-viewer.exe --history out/windows-pocket/voxel-animation.json --viewer
      - name: Verify history and render initial middle final and rewind with WARP
        shell: pwsh
        run: |
          ./out/windows-viewer/menkh-viewer.exe out/windows-pocket/voxel-animation.json --verify-history --warp --debug --smoke out/windows-viewer-smoke 2>&1 | Tee-Object out/windows-viewer-render.log
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 viewer smoke test failed' }
          ./out/windows-viewer/menkh-viewer.exe out/windows-pocket/voxel-animation.json --warp --debug --window-smoke out/windows-viewer-smoke 2>&1 | Tee-Object out/windows-viewer-window.log
          if ($LASTEXITCODE -ne 0) { throw "D3D12 window smoke test failed: exit $LASTEXITCODE" }
      - name: Package ready-to-run viewer and pocket history
        shell: pwsh
        run: |
          python scripts/package-windows-viewer.py --binary-dir out/windows-viewer --history out/windows-pocket/voxel-animation.json --out out/menkh-windows-viewer-demo.zip --engine zig-out/bin/menkh.exe --job out/windows-pocket-job.json
          if ($LASTEXITCODE -ne 0) { throw 'Viewer package failed' }
          python scripts/test-windows-package.py --zip out/menkh-windows-viewer-demo.zip --out out/windows-package-test --render
          if ($LASTEXITCODE -ne 0) { throw 'Packaged viewer colors failed' }
      - name: Upload Windows viewer and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-d3d12-viewer
          path: |
            out/scene-test/left.ppm
            out/scene-test/right.ppm
            out/live-test/
            out/windows-live/
            out/live-overlays/validation.json
            out/live-overlays/images/
            out/windows-viewer/menkh.exe
            out/windows-viewer/menkh-viewer.exe
            out/windows-viewer/Voxel.hlsl
            out/windows-viewer-smoke/
            out/windows-package-test/images/
            out/windows-job-render-images/
            out/windows-provenance.ppm
            out/windows-profile.ppm

            out/windows-playback-provenance/
            out/windows-job-runner/
            out/windows-library-runner/
            out/windows-dll-render-images/
            out/windows-viewer/menkh.dll
            out/windows-viewer-*.log
            out/menkh-windows-viewer-demo.zip
          if-no-files-found: error
